# Se prueba en Linux y en Windows de verdad: sintaxis, servidor y arrancador.
# No hay dependencias que instalar ni nada que construir.
name: pruebas

on:
  push:
  pull_request:

jobs:
  pruebas:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['18', '22']
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.os }} · Node ${{ matrix.node }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Sintaxis y formato
        run: node dev/check.mjs
      - name: Servidor
        run: node dev/smoke.mjs
      - name: Arrancador
        run: node dev/launcher.mjs
